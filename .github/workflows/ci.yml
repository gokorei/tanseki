name: CI

# This repository is read-only: pull requests are closed without merge (see
# GOVERNANCE.md), so there is no `pull_request` trigger. Running the container,
# Trivy, and pinned-pijul jobs on a PR that cannot land would spend CI minutes
# to produce a verdict nobody acts on. `workflow_dispatch` keeps a manual run
# available for the maintainer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Gradle invocation per job on purpose. The root `check` aggregates every
  # gate (spec/SDK drift, generated-SDK tests, ktlint + detekt, the detekt
  # baseline budget, whitespace hygiene, the license check, and the JVM coverage
  # budget), and each module's lint pass runs exactly once per invocation, so
  # naming `ktlintCheck`/`detekt` alongside `build` would only schedule the same
  # work from a second direction.
  build:
    name: build, tests, and repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: false

      - name: Install the pinned pijul
        # Vault tests and runtime paths shell out to the `pijul` binary (see
        # CONTRIBUTING.md), so the main build carries the same pin as the
        # dedicated pijul job rather than skipping that coverage. `libsodium-dev`
        # is a compile-time input of `libsodium-sys`, which the runner image
        # does not ship.
        env:
          PIJUL_VERSION: 1.0.0-beta.24
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev pkg-config
          cargo install --root "$HOME/.local" "pijul" --version "=$PIJUL_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Named explicitly, and ahead of `build`, so the contract gates have their
      # own line in the log. `build` runs them too — the root `check` lifecycle
      # aggregates all of them — but a gate that is only reachable through an
      # aggregate is one refactor away from silently disappearing.
      - name: OpenAPI, generated SDK, version, license, and container gates
        run: |
          ./gradlew --no-daemon \
            checkOpenApiAndSdkDrift \
            checkVersionSource \
            checkLicense \
            checkContainerContract

      - name: Build, test, and repository gates
        run: ./gradlew build --no-daemon

      - name: Whitespace hygiene
        run: ./gradlew checkNoTrailingWhitespace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            "**/build/reports/tests/**"
            # The skip ledger, so a reviewer can see at a glance which suites did
            # not run in this job and why, rather than having to infer it from a
            # green build.
            "**/build/reports/checkUnexpectedTestSkips/**"
            .ci/daemon.log
          if-no-files-found: ignore

  # An independent, tool-free sweep of every tracked file. The Gradle gate runs
  # inside `build`; this one needs no JDK, runs in seconds, and reports the
  # offending line, so a stray trailing space is caught in review rather than at
  # the end of a full build.
  text-hygiene:
    name: text hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: No trailing whitespace in tracked text
        run: |
          set -euo pipefail
          # `.editorconfig` trims every text file except Markdown; the Gradle
          # wrapper scripts are generated by `gradle wrapper` and keep whatever
          # the toolchain emits, so they are exempt by name. A line that is only
          # whitespace is not a violation: ktlint accepts it and it can be
          # load-bearing inside a raw string.
          offenders="$(git grep -nI -E '[^[:space:]][[:space:]]+$' -- . ':(exclude)*.md' ':(exclude)gradlew' ':(exclude)gradlew.bat' || true)"
          if [ -n "$offenders" ]; then
            printf '%s\n' "$offenders"
            echo "::error::trailing whitespace in tracked files (see the list above)"
            exit 1
          fi
          echo "no trailing whitespace in tracked text files"

  # Real containers, real Meilisearch. The suites are gated on
  # TANSEKI_RUN_MEILI_INTEGRATION, which the convention plugin sets from
  # -Ptanseki.runIntegrationTests=true, and `checkRequiredIntegrationCoverage`
  # then fails if any of them was skipped rather than run.
  integration:
    name: real Meilisearch and PostgreSQL contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: false

      - name: Run the container-backed contracts
        # `coverageBudget` is deliberately absent here: it needs JaCoCo reports
        # from every module, which only the full `./gradlew build` in the build
        # job produces (and `check` enforces it there). This job's coverage duty
        # is `checkRequiredIntegrationCoverage` below: the suites it names must
        # have run against real containers.
        run: |
          ./gradlew --no-daemon -Ptanseki.runIntegrationTests=true \
            :adapters:lookup-meili:test \
            :adapters:context-postgres:test \
            :composition:test \
            :cli:test \
            :service:test \
            checkRequiredIntegrationCoverage

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # Pijul is an external binary, so its contract is only real if a real binary
  # runs it. The version is pinned to an exact release and verified after the
  # install; the flow below is the only coverage of `pijul init`, `record`, and
  # `diff`, because every JVM test in :adapters:pijul-cli stubs the binary out.
  pijul:
    name: real pinned pijul
    runs-on: ubuntu-latest
    env:
      PIJUL_VERSION: 1.0.0-beta.24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: false

      - name: Install the pinned pijul
        # Pijul publishes no Linux binary (`pijul.org/releases/...` answers with
        # the site's HTML page), so the pin is installed from the crates.io
        # release of the exact version. `--locked` is not used: the published
        # lockfile pins dependencies that no longer compile on current
        # toolchains, and the pijul version is what the contract is pinned to.
        # `libsodium-dev` is a compile-time input of `libsodium-sys`, which the
        # runner image does not ship: without it `cargo install` fails in the
        # crate's build script rather than in any Tanseki code.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev pkg-config
          cargo install --root "$HOME/.local" "pijul" --version "=$PIJUL_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The adapter resolves an explicit TANSEKI_PIJUL_BINARY first and only
          # then falls back to PATH. `$HOME` cannot go in a step `env:` mapping
          # (it is passed literally, and `${{ env.HOME }}` is empty in the
          # expression context), so it is exported here where the shell expands
          # it. Every later step — including the Gradle workers — inherits it.
          echo "TANSEKI_PIJUL_BINARY=$HOME/.local/bin/pijul" >> "$GITHUB_ENV"

      - name: Verify the pin
        run: |
          set -euo pipefail
          installed="$(pijul --version)"
          echo "installed: $installed (pinned: $PIJUL_VERSION)"
          test "$installed" = "pijul $PIJUL_VERSION"

      - name: Create a signing identity
        # `pijul record` signs the change it creates, and it refuses to record
        # without an identity ("Cannot parse public key"). A fresh runner has
        # none, so the suite would fail for a reason that has nothing to do with
        # the adapter. `--no-link` keeps the identity offline-only.
        # `pijul identity new` still talks to an SSH agent even with `--no-link`
        # ("SSH agent error: SSH_AUTH_SOCK not found" without one), and it needs
        # a key loaded in the agent ("No SSH keys in agent" without one). An
        # ephemeral ed25519 key is generated for the run — it signs local test
        # records only and is never committed — and the socket is exported to
        # every later step through GITHUB_ENV: the adapter tests and the daemon
        # smoke test below both record through it.
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/ci-pijul-key" -C "ci@gokorei.dev"
          ssh-add "$RUNNER_TEMP/ci-pijul-key"
          pijul identity new --no-link --email "ci@gokorei.dev" --display-name "Tanseki CI"

      - name: Drive PijulCliClient against the real binary
        # The stubbed unit tests cannot catch a flag the pinned release rejects,
        # so this job runs the adapter against a real binary. The binary path
        # arrives via GITHUB_ENV from the install step, where the shell expands
        # $HOME; it cannot be written here (step env is literal).
        env:
          TANSEKI_RUN_PIJUL_INTEGRATION: "true"
        run: ./gradlew :adapters:pijul-cli:test --no-daemon

      - name: Install the daemon distribution
        run: ./gradlew :service:installDist --no-daemon

      - name: Drive a real pijul vault through the /v1 seam
        run: |
          set -euo pipefail
          vault="$PWD/.ci/vault"
          mkdir -p "$vault" "$PWD/.ci/index"
          export TANSEKI_PROFILE=vault \
            TANSEKI_PATH="$vault" \
            TANSEKI_INDEX_DIR="$PWD/.ci/index" \
            TANSEKI_API_KEY=ci-pijul-key \
            TANSEKI_HTTP_HOST=127.0.0.1 \
            TANSEKI_HTTP_PORT=8090 \
            TANSEKI_PIJUL_BINARY="$(command -v pijul)"
          nohup service/build/install/tanseki-daemon/bin/tanseki-daemon > .ci/daemon.log 2>&1 &
          echo "$!" > .ci/daemon.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/v1/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8090/v1/health
          # The vault must be a real pijul repository by now, not a plain
          # directory the store happened to read.
          test -d "$vault/.pijul"
          curl --fail --silent \
            -H "X-API-Key: ci-pijul-key" \
            -H "Content-Type: application/json" \
            -X POST http://127.0.0.1:8090/v1/documents:upsert \
            -d '{"id":"ci/pijul/note","content":"# CI\n\nreal pijul write","frontmatter":{"tags":["ci"]}}' \
            | tee .ci/upsert.json
          echo
          grep -q '"revision"' .ci/upsert.json
          curl --fail --silent \
            -H "X-API-Key: ci-pijul-key" \
            --get --data-urlencode "q=pijul" http://127.0.0.1:8090/v1/search \
            | tee .ci/search.json
          echo
          grep -q "ci/pijul/note" .ci/search.json
          # And the real binary must own the change. `pijul log` prints message and
          # author only — never a path — so the recorded document is proven through
          # the change itself, and the tree is proven clean for it.
          revision="$(python3 -c 'import json,sys;print(json.load(open(".ci/upsert.json"))["revision"])')"
          (cd "$vault" && pijul change "$revision") | tee .ci/pijul-change.txt
          grep -q 'note.md' .ci/pijul-change.txt
          (cd "$vault" && pijul list) | tee .ci/pijul-list.txt
          grep -q 'ci/pijul/note.md' .ci/pijul-list.txt
          # No leftover working-copy change for the document.
          test -z "$(cd "$vault" && pijul diff --json | python3 -c 'import json,sys;print("".join(k for k in json.load(sys.stdin) if k != "/"))')"

      - name: Upload the daemon log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pijul-daemon-log
          path: ".ci"
          if-no-files-found: ignore

  # The published image is the deployment artifact, so it gets built and smoked
  # the way a dependent runs it: publish, then the documented health surface.
  docker:
    name: docker image build and health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build the image
        run: docker build -f service/Dockerfile -t tanseki-ci .

      - name: Health smoke
        run: |
          set -euo pipefail
          # `--network host`, not a published port: the daemon binds loopback by
          # default and the security posture rejects wildcard binds, so through
          # bridge NAT the mapped port has nothing behind it (host curls are
          # refused/reset while the container-local HEALTHCHECK passes). On host
          # networking the container shares the loopback, which is exactly the
          # documented access pattern (`curl localhost:8088/v1/health`). This is
          # Linux-only, which is all this job runs on.
          docker run --rm -d --name tanseki-ci \
            --network host \
            -e TANSEKI_PROFILE=library \
            -e TANSEKI_PATH=/vault/library.db \
            -e TANSEKI_INDEX_DIR=/vault/.tanseki/index \
            -e TANSEKI_API_KEY=ci-docker-key \
            tanseki-ci
          trap 'docker logs tanseki-ci || true; docker rm -f tanseki-ci || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/v1/health > /dev/null; then
              break
            fi
            sleep 2
          done
          echo "--- /v1/health"
          curl --fail --silent http://127.0.0.1:8088/v1/health | tee .docker-health.json
          echo
          grep -q '"status":"ok"' .docker-health.json
          echo "--- /v1/ready"
          curl --fail --silent http://127.0.0.1:8088/v1/ready | tee .docker-ready.json
          echo
          grep -q '"ready":true' .docker-ready.json
          echo "--- /v1/metrics (authenticated)"
          curl --fail --silent -H "X-API-Key: ci-docker-key" http://127.0.0.1:8088/v1/metrics > /dev/null
          echo "--- unauthenticated /v1/metrics is refused"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/v1/metrics)"
          test "$status" = "401" || test "$status" = "403"
          echo "--- the image's own HEALTHCHECK reports healthy"
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' tanseki-ci)"
            if [ "$health" = "healthy" ]; then
              echo "docker health status: $health"
              exit 0
            fi
            sleep 5
          done
          docker inspect --format '{{json .State.Health}}' tanseki-ci
          exit 1

      # The filesystem scan in `dependency-audit` covers what is committed; this
      # covers what is actually shipped. The image is the only place the JRE
      # base layers, the apt-installed `curl`, and the runtime jars from
      # `:service:installDist` all exist together, so a filesystem scan of the
      # repository cannot see a CVE in any of them.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tanseki-ci
          format: table
          output: trivy-image-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the image for secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tanseki-ci
          format: table
          output: trivy-image-config-report.txt
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate the image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b
        with:
          image: tanseki-ci
          format: spdx-json
          output-file: image-sbom.spdx.json

      - name: Upload the image security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-artifacts
          path: |
            trivy-image-report.txt
            trivy-image-config-report.txt
            image-sbom.spdx.json
          if-no-files-found: ignore

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Resolve production dependencies
        run: ./gradlew :service:dependencies --configuration runtimeClasspath --no-daemon

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan the container definition
        # `./gradlew checkContainerContract` already pins the base images and the
        # build context; this checks the instructions themselves (an unpinned
        # `apt-get install`, a missing `--no-install-recommends`, a secret in a
        # build argument) against the upstream rule set.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: service/Dockerfile
          scanners: misconfig
          format: table
          output: trivy-dockerfile-report.txt
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Verify the container contract locally reproducible
        run: ./gradlew checkContainerContract --no-daemon

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-artifacts
          path: |
            sbom.spdx.json
            trivy-report.txt
            trivy-dockerfile-report.txt
          if-no-files-found: ignore
