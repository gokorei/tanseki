org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.dependency.verification=strict
kotlin.code.style=official

# Single source of release identity. `docs/openapi.json`, both generated SDKs,
# and every Gradle module read these values.
#
# Namespaced under the parent organisation, gokorei.
tansekiVersion=1.0.0
tansekiGroup=dev.gokorei
tansekiGitHost=github.com
tansekiGitUserId=gokorei
tansekiGitRepoId=tanseki
# Author/contact stamped into the generated SDKs. Left unset they would carry
# the generator's own project and address, which misattributes the artifact.
tansekiInfoName=Tanseki
tansekiInfoEmail=ci@gokorei.dev

# Set to true on hosts with Docker to make the Postgres and Meilisearch suites
# required; `checkRequiredIntegrationCoverage` then fails if they were skipped.
tanseki.runIntegrationTests=false